name: Airbrite
description: >-
  Airbrite was an early commerce-infrastructure startup (a16z portfolio) that
  offered a hosted order-management and payments/commerce backend API for
  merchants and developers, with JavaScript and Python client SDKs and an
  embeddable checkout. The product was later rebranded and pivoted to "Celery"
  (pre-order / crowdfunding commerce). Airbrite is now defunct: its primary
  developer domains (airbrite.io, getairbrite.com) no longer resolve and
  airbrite.com is a parked domain, so there is no live developer portal, API
  reference, or hosted API to enrich. What remains verifiable is the public
  github.com/airbrite organization and the client libraries still published on
  npm and PyPI. This profile records that residual, evidence-backed surface;
  most enrichment artifact types are legitimately empty because the provider no
  longer operates.
